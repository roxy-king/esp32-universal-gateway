name: Server and deployment tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r server/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s project_starter/tests -v
      - run: python project_starter/tools/project.py check
      - run: bash -n project_starter/install.sh && bash project_starter/install.sh --check
      - run: bash -n install.sh deploy/install.sh && bash install.sh --check
      - run: ./tests/test_ap_info.ps1
        shell: pwsh
