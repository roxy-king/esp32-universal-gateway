<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
:root{--ink:#243338;--muted:#52656a;--line:#dae2e3;--accent:#205d50}*{box-sizing:border-box}body{margin:0;background:#eef2f2;color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{max-width:1200px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}main{max-width:1200px;margin:0 auto 24px;background:#fff;border:1px solid #e0e6e6;border-radius:12px;padding:24px}h1{font-size:26px;margin:0 0 6px}h2{font-size:18px;margin:0 0 16px}h3{font-size:16px;margin:16px 0 8px}p{margin:8px 0 16px}small,.muted{color:var(--muted)}input,select,textarea,button{font:inherit;color:inherit;border:1px solid #b7c5c8;border-radius:6px;padding:9px 12px;background:white}input,select,textarea{width:100%;margin:5px 0 12px}button{cursor:pointer;min-height:40px}button:hover:not(:disabled){background:#eef3f2}button:disabled{opacity:.5;cursor:not-allowed}button.primary{background:#243b3e;color:white}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #287966;outline-offset:2px}label{display:block}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px}nav button{border:0;background:transparent}nav button.active{background:#e9eeee;font-weight:600}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:28px}.panel{min-width:0}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:20px 0}.metric{padding:12px 0}.metric span{display:block;color:var(--muted);font-size:13px}.metric strong{font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}.metric small{margin-left:4px}.links{display:flex;gap:24px;flex-wrap:wrap;margin:18px 0}.good{color:#205d50}.bad{color:#a12d2d}.notice{padding:10px 14px;background:#fff1e9;border-radius:6px;margin:12px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1;min-width:100px}.row button{flex:0 1 auto}.check{display:flex;align-items:center;gap:8px;font-size:14px}.check input{width:auto;margin:0}#login{max-width:380px;margin:28px auto}#message{white-space:pre-wrap;margin:12px 0}dl{display:grid;grid-template-columns:100px 1fr;gap:5px 12px;font-size:14px}dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}details{margin:14px 0}summary{cursor:pointer;font-weight:600}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid #e6ebec;overflow-wrap:anywhere}th{font-weight:500;color:var(--muted)}td.numeric,th.numeric{text-align:right;font-variant-numeric:tabular-nums}.table-wrap{overflow:auto}#chatLayout{display:grid;grid-template-columns:200px 1fr;gap:24px}#threads button{display:block;width:100%;text-align:left;margin:6px 0;overflow-wrap:anywhere}.messages{height:400px;overflow:auto;padding:12px 0}.bubble{max-width:85%;padding:12px 16px;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0;background:#f3f6f6;border-radius:8px}.bubble.user{margin-left:auto;background:#e5efeb}.bubble.assistant{background:transparent;padding-left:0}.empty{padding:20px;color:var(--muted);background:#f5f7f7;border-radius:6px}section[hidden],[hidden]{display:none!important}.form{max-width:560px}.tabscreen{min-height:360px}#history{max-height:340px;overflow:auto}.action-note{min-height:24px}footer{margin-top:24px;font-size:13px;color:var(--muted)}@media(max-width:700px){main{margin:0 8px 12px;padding:18px}header{padding:16px}.grid{grid-template-columns:1fr;gap:22px}h1{font-size:24px}.metrics{gap:8px}.metric strong{font-size:23px}.links{display:block}.links span{display:block;margin:6px 0}#chatLayout{grid-template-columns:1fr}#threads{display:flex;gap:8px;overflow:auto}#threads button{min-width:140px;width:auto}.messages{height:360px}button{min-height:44px}dl{grid-template-columns:85px 1fr}td,th{min-width:95px}}
</style>
<header><strong>↔ Link / 项目平台</strong><button id="logout" hidden>退出登录</button></header>
<main><h1 id="title">__TITLE__</h1><p id="description" class="muted">设备状态与项目控制</p><div id="message" role="status"></div>
<form id="login"><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label><button class="primary">登录</button></form>
<div id="workspace" hidden><div class="row"><label>当前设备<select id="device"></select></label><label class="check"><input id="offlineAlert" type="checkbox" checked>离线时页面提醒</label></div><div class="links"><span id="webState">网页连接中</span><span id="espState">等待网关</span><span id="mcuState">等待单片机</span></div><div id="notice" class="notice" role="alert" hidden></div>
<nav aria-label="功能"><button data-page="control" class="active">控制台</button><button data-page="schedules">预约</button><button data-page="records">记录与方案</button><button data-page="assistant">AI 助手</button><button data-page="settings">设置</button></nav>
<section id="control" class="tabscreen"><div class="grid"><div class="panel"><h2>实时状态</h2><div id="metrics" class="metrics"></div><p id="freshness" class="muted"></p><h2>设备配置摘要</h2><dl id="summary"></dl><details><summary>设备名称与 ID</summary><form id="deviceForm"><label>显示名称<input name="name" maxlength="48"></label><label>控制台 ID<input name="display_id" pattern="[A-Za-z0-9_-]{1,48}" required maxlength="48"></label><small>通过独立令牌配对，ESP 端 ID 无需相同。</small><p><button>保存设备设置</button></p></form></details></div>
<div class="panel"><h2>操作设备</h2><form id="actionForm"><label>操作<select id="command"></select></label><label id="valueLabel">参数<div id="valueControl"></div></label><p id="limits" class="muted"></p><div class="row"><button class="primary" id="execute">执行操作</button><button type="button" id="savePreset">存为常用方案</button></div></form><p class="action-note" id="actionResult" role="status">执行成功以单片机回执为准。</p><h3>常用方案</h3><div id="presetButtons" class="row"></div><h3>最近执行</h3><div id="recent" class="empty">暂无操作</div></div></div></section>
<section id="schedules" class="tabscreen" hidden><h2>预约任务</h2><p class="muted">时区 GMT+8。到时离线会记为失败，不自动重发。</p><form id="scheduleForm" class="form"><label>操作<select id="scheduleCommand"></select></label><label>参数<input id="scheduleValue" type="number" step="1" required></label><label>开始时间（GMT+8）<input id="scheduleAt" type="datetime-local" step="1" required></label><button class="primary">确认预约</button></form><div id="scheduleList" class="table-wrap"></div></section>
<section id="records" class="tabscreen" hidden><h2>执行记录</h2><div id="jobList" class="table-wrap"></div><h2 style="margin-top:24px">常用方案</h2><div id="presetList"></div><h2 style="margin-top:24px">状态历史</h2><button id="loadHistory">读取最近记录</button><div id="history"></div></section>
<section id="assistant" class="tabscreen" hidden><h2>AI 助手</h2><div id="chatLayout"><aside><button id="newThread">新对话</button><div id="threads"></div></aside><div><div class="row"><strong id="threadTitle">请选择或新建对话</strong><button id="deleteThread">删除当前对话</button></div><div id="messages" class="messages" aria-live="polite"></div><div id="proposal" class="notice" hidden></div><form id="chatForm"><label>消息<textarea id="chatInput" rows="2" maxlength="4000" required placeholder="查询状态、了解操作，或提出控制需求"></textarea></label><button id="chatSend" class="primary">发送</button></form></div></div></section>
<section id="settings" class="tabscreen" hidden><div class="grid"><div><h2>网站设置</h2><form id="siteForm"><label>网站标题<input name="title" maxlength="48" required></label><button>保存标题</button></form><h2 style="margin-top:24px">AI 接口</h2><form id="aiForm"><label>Base URL<input name="base_url" type="url" placeholder="https://api.example.com/v1" required></label><label>模型名称<input name="model" maxlength="120" required></label><label>API Key<input name="key" type="password" autocomplete="new-password" placeholder="留空保留已保存密钥"></label><p id="aiState" class="muted"></p><div class="row"><button>保存 API 设置</button><button type="button" id="disableAI">清除密钥</button></div></form></div><div><h2>账号设置</h2><form id="accountForm"><label>用户名<input name="username" required autocomplete="username"></label><label>当前密码<input name="current_password" type="password" required autocomplete="current-password"></label><label>新密码<input name="new_password" type="password" minlength="8" required autocomplete="new-password"></label><label>再次输入<input name="confirm_password" type="password" minlength="8" required autocomplete="new-password"></label><button>保存并重新登录</button></form></div></div></section>
<footer>Gateway v1 · 串口项目协议 P1 · 设备保护逻辑在单片机本地运行</footer></div></main>
<script>
let state={},csrf='',busy=false,online=false,editedDevice='',thread='',proposal=null,page='control',polling=false;const $=s=>document.querySelector(s),seen=new Map(),offline=new Set();
const names={queued:'待发送',sent:'等待回执',succeeded:'执行成功',failed:'失败',unknown:'结果未知',pending:'待执行',running:'执行中',missed:'已错过',cancelled:'已取消',scheduled:'已预约'};
function el(tag,text){const x=document.createElement(tag);x.textContent=text;return x}
function message(t,error=false){$('#message').textContent=t;$('#message').className=error?'bad':'good'}
async function api(url,data){const r=await fetch(url,{signal:AbortSignal.timeout(url==='/api/ai/chat'?55000:15000),method:data===undefined?'GET':'POST',headers:data===undefined?{}:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:data===undefined?undefined:JSON.stringify(data)});const j=await r.json();if(!r.ok){const e=Error(j.error||'请求失败');e.status=r.status;throw e}return j}
function device(){return state.devices?.find(x=>x.id===$('#device').value)}
function spec(key){return state.project?.commands.find(x=>x.key===key)}
function date(t){return t?new Date(t*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'—'}
function switchPage(id){page=id;document.querySelectorAll('.tabscreen').forEach(x=>x.hidden=x.id!==id);document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));if(id==='settings')run(loadAI)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
function param(){const c=spec($('#command').value);if(!c)return;let input;if(c.choices){input=document.createElement('select');Object.entries(c.choices).forEach(([v,l])=>input.add(new Option(l,v)))}else{input=document.createElement('input');input.type='number';input.min=c.min;input.max=c.max;input.step=1}input.id='value';input.required=true;input.value=c.default;$('#valueControl').replaceChildren(input);$('#limits').textContent=c.min===c.max?'此操作无额外参数':`允许范围 ${c.min}–${c.max} ${c.unit||''}`;input.disabled=c.min===c.max}
function scheduleParam(){const c=spec($('#scheduleCommand').value);if(c){$('#scheduleValue').min=c.min;$('#scheduleValue').max=c.max;$('#scheduleValue').value=c.default}}
$('#command').onchange=param;$('#scheduleCommand').onchange=scheduleParam;
function render(){const d=device(),s=d?.project_state||{},g=s.gateway||{};$('#webState').textContent=online?'网页 → 云端：正常':'网页 → 云端：无法获取状态';$('#espState').textContent='ESP → 云端：'+(!online?'未知':s.connected?'在线':'离线');$('#mcuState').textContent='单片机 → ESP：'+(!online?'未知':s.fresh?'本项目数据有效':'尚无有效状态 / 已过期');$('#execute').disabled=busy||!online||!s.fresh||!s.remote_write;
$('#metrics').replaceChildren(...(state.project?.fields||[]).map(f=>{const x=el('div','');x.className='metric';x.append(el('span',f.label),el('strong',s.values?.[f.key]??'—'),el('small',f.unit||''));return x}));$('#freshness').textContent='最近状态：'+date(s.received)+(s.fresh?'':'（旧数据不能证明设备当前状态）');
const rows=[['固件',g.firmware||'—'],['Wi-Fi',g.ssid?`${g.ssid} / ${g.rssi} dBm`:'—'],['串口',g.baud?`${g.baud} / ${g.format} / RX${g.rx} TX${g.tx}`:'尚未上报'],['远程写入',g.remote_write?'开启':'关闭'],['ESP ID',d?.reported_id||'—']];$('#summary').replaceChildren(...rows.flatMap(([k,v])=>[el('dt',k),el('dd',v)]));
if(d&&editedDevice!==d.id){$('#deviceForm').elements.name.value=d.name||'';$('#deviceForm').elements.display_id.value=d.display_id;editedDevice=d.id}
const lost=(state.devices||[]).filter(x=>offline.has(x.id));$('#notice').hidden=!$('#offlineAlert').checked||!lost.length;$('#notice').textContent='设备已离线：'+lost.map(x=>x.name||x.display_id).join('、')+'。恢复后会自动清除提醒。';
const jobs=(state.jobs||[]).filter(x=>x.device===d?.id);$('#recent').textContent=jobs.length?`${spec(jobs[0].command)?.label||jobs[0].command} · ${names[jobs[0].status]} · ${jobs[0].result}`:'暂无操作';
table('#jobList',['时间 GMT+8','操作','参数','结果'],jobs.map(x=>[date(x.created),spec(x.command)?.label||x.command,x.value,(names[x.status]||x.status)+' · '+x.result]));
table('#scheduleList',['时间 GMT+8','操作','状态','管理'],(state.schedules||[]).filter(x=>x.device===d?.id).map(x=>{const b=el('button','取消');b.disabled=x.status!=='pending';b.onclick=()=>run(async()=>{await api('/api/schedules/cancel',{id:x.id});await refresh()});return[date(x.due),(spec(x.command)?.label||x.command)+' '+x.value,(names[x.status]||x.status)+' · '+x.result,b]}));
$('#presetButtons').replaceChildren();$('#presetList').replaceChildren();for(const p of state.presets||[]){const b=el('button',p.name);b.onclick=()=>{$('#command').value=p.command;param();$('#value').value=p.value;switchPage('control');$('#execute').focus()};$('#presetButtons').append(b);const row=el('p',p.name+' · '+(spec(p.command)?.label||p.command)+' '+p.value+' '),del=el('button','删除');del.onclick=()=>run(async()=>{await api('/api/presets',{delete:p.id});await refresh()});row.append(del);$('#presetList').append(row)}
$('#threads').replaceChildren(...(state.threads||[]).map(t=>{const b=el('button',t.title);b.onclick=()=>run(()=>openThread(t.id));if(t.id===thread)b.className='primary';return b}));
}
function table(selector,headers,rows){if(!rows.length){$(selector).replaceChildren(el('p','暂无记录'));return}const t=document.createElement('table'),head=document.createElement('tr');const numeric=headers.map((_,i)=>rows.some(row=>typeof row[i]==='number'||/^\d{4}[/-]/.test(String(row[i]))));headers.forEach((x,i)=>{const th=el('th',x);if(numeric[i])th.className='numeric';head.append(th)});const thead=document.createElement('thead');thead.append(head);t.append(thead);const body=document.createElement('tbody');for(const values of rows){const tr=document.createElement('tr');for(const [i,value] of values.entries()){const td=document.createElement('td');if(numeric[i])td.className='numeric';if(value instanceof Node)td.append(value);else td.textContent=value;tr.append(td)}body.append(tr)}t.append(body);$(selector).replaceChildren(t)}
async function refresh(){if(polling)return;polling=true;try{const first=!state.project;state=await api('/api/overview');csrf=state.csrf;online=true;$('#login').hidden=true;$('#workspace').hidden=false;$('#logout').hidden=false;const old=$('#device').value;$('#device').replaceChildren(...state.devices.map(d=>new Option(d.name||d.display_id,d.id)));if(state.devices.some(d=>d.id===old))$('#device').value=old;for(const d of state.devices){if(seen.get(d.id)===true&&!d.connected)offline.add(d.id);if(d.connected)offline.delete(d.id);seen.set(d.id,d.connected)}if(first){$('#command').replaceChildren(...state.project.commands.map(c=>new Option(c.label,c.key)));$('#scheduleCommand').replaceChildren(...state.project.commands.filter(c=>c.schedulable).map(c=>new Option(c.label,c.key)));param();scheduleParam();$('#description').textContent=(state.demo?'模拟演示 · 未连接真实硬件。 ':'')+(state.project.description||'');$('#siteForm').elements.title.value=state.site.title||state.project.name;$('#accountForm').elements.username.value=state.username;for(const [key,tab] of [['schedules','schedules'],['assistant','assistant']])document.querySelector(`[data-page="${tab}"]`).hidden=!state.project.features[key];$('#savePreset').hidden=!state.project.features.presets}$('#title').textContent=state.site.title||state.project.name;document.title=$('#title').textContent;render()}catch(e){online=false;if(e.status===401){$('#login').hidden=false;$('#workspace').hidden=true;$('#logout').hidden=true;csrf='';state={};seen.clear();offline.clear();editedDevice=''}else if(state.project)render();else message('暂时无法连接服务，请稍后重试',true)}finally{polling=false}}
async function run(fn){try{await fn()}catch(e){message(e.message,true)}}
$('#device').onchange=()=>{editedDevice='';proposal=null;$('#proposal').hidden=true;render()};
try{$('#offlineAlert').checked=localStorage.getItem('project-offline-alert')!=='off'}catch(e){}$('#offlineAlert').onchange=()=>{try{localStorage.setItem('project-offline-alert',$('#offlineAlert').checked?'on':'off')}catch(e){}render()};
$('#login').onsubmit=e=>{e.preventDefault();run(async()=>{await api('/api/login',Object.fromEntries(new FormData(e.target)));e.target.reset();message('');await refresh()})};$('#logout').onclick=()=>run(async()=>{await api('/api/logout',{});thread='';$('#messages').replaceChildren();await refresh()});
async function submitAction(data){const prepared=await api('/api/action/prepare',data);if(prepared.confirm&&!confirm(prepared.summary+(prepared.at?'\n预约 '+prepared.at:'')+'\n确认执行？'))return;busy=true;render();try{const result=await api('/api/action',{ticket:prepared.ticket});$('#actionResult').textContent=(names[result.status]||result.status)+'：'+result.result;message($('#actionResult').textContent,result.status==='unknown'||result.status==='failed')}finally{busy=false;await refresh()}}
$('#actionForm').onsubmit=e=>{e.preventDefault();run(()=>submitAction({device:$('#device').value,command:$('#command').value,value:Number($('#value').value)}))};
$('#scheduleForm').onsubmit=e=>{e.preventDefault();run(()=>submitAction({device:$('#device').value,command:$('#scheduleCommand').value,value:Number($('#scheduleValue').value),at:$('#scheduleAt').value+'+08:00'}))};
$('#savePreset').onclick=()=>run(async()=>{const name=prompt('方案名称');if(!name)return;await api('/api/presets',{name,command:$('#command').value,value:Number($('#value').value)});await refresh()});
$('#deviceForm').onsubmit=e=>{e.preventDefault();run(async()=>{await api('/api/devices/'+encodeURIComponent($('#device').value)+'/settings',Object.fromEntries(new FormData(e.target)));editedDevice='';message('设备设置已保存');await refresh()})};
$('#siteForm').onsubmit=e=>{e.preventDefault();run(async()=>{await api('/api/site',Object.fromEntries(new FormData(e.target)));message('网站标题已保存');await refresh()})};
$('#accountForm').onsubmit=e=>{e.preventDefault();run(async()=>{await api('/api/account',Object.fromEntries(new FormData(e.target)));e.target.reset();message('账号已更新，请重新登录');await refresh()})};
$('#loadHistory').onclick=()=>run(async()=>{const rows=await api('/api/history?device='+encodeURIComponent($('#device').value));table('#history',['时间 GMT+8',...state.project.fields.map(f=>f.label)],rows.map(r=>{const v=JSON.parse(r.data);return[date(r.stamp),...state.project.fields.map(f=>v[f.key]??'—')]}))});
async function loadAI(){const c=await api('/api/ai/settings');$('#aiForm').elements.base_url.value=c.base_url;$('#aiForm').elements.model.value=c.model;$('#aiState').textContent=c.key_set?'密钥已保存，留空不修改':'尚未配置密钥';}
$('#aiForm').onsubmit=e=>{e.preventDefault();run(async()=>{await api('/api/ai/settings',Object.fromEntries(new FormData(e.target)));e.target.elements.key.value='';message('AI 设置已保存');await loadAI()})};$('#disableAI').onclick=()=>run(async()=>{if(!confirm('清除已保存的 API 密钥？'))return;await api('/api/ai/settings',{disable:true});await loadAI()});
function bubble(role,text){const b=el('div',text);b.className='bubble '+role;$('#messages').append(b);$('#messages').scrollTop=$('#messages').scrollHeight}
async function openThread(id){thread=id;proposal=null;$('#proposal').hidden=true;$('#threadTitle').textContent=state.threads?.find(t=>t.id===id)?.title||'新对话';const messages=await api('/api/ai/threads?id='+encodeURIComponent(id));$('#messages').replaceChildren();messages.forEach(x=>bubble(x.role,x.content));render()}
$('#newThread').onclick=()=>run(async()=>{const t=await api('/api/ai/threads',{});await refresh();await openThread(t.id)});$('#deleteThread').onclick=()=>run(async()=>{if(!thread||!confirm('删除这段对话？'))return;await api('/api/ai/threads',{delete:thread});thread='';$('#messages').replaceChildren();$('#proposal').hidden=true;await refresh()});
$('#chatForm').onsubmit=e=>{e.preventDefault();run(async()=>{if(!thread){const t=await api('/api/ai/threads',{});thread=t.id}const text=$('#chatInput').value;$('#chatSend').disabled=true;$('#proposal').hidden=true;try{const d=await api('/api/ai/chat',{thread,text,device:$('#device').value});$('#chatInput').value='';bubble('user',text);bubble('assistant',d.reply);proposal=d.proposal;if(proposal){const b=el('button','确认此方案');$('#proposal').replaceChildren(el('p',proposal.summary+(proposal.at?' · '+proposal.at:'')),b);$('#proposal').hidden=false;b.onclick=()=>run(async()=>{b.disabled=true;try{const result=await api('/api/action',{ticket:proposal.ticket});bubble('assistant',(names[result.status]||result.status)+'：'+result.result);$('#proposal').hidden=true;await refresh()}catch(e){$('#proposal').hidden=true;throw e}})}await refresh()}finally{$('#chatSend').disabled=false}})};
(async function tick(){await refresh();setTimeout(tick,1000)})();
</script></html>
