<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Link · 远程串口控制台</title>
<style>*{box-sizing:border-box}body{background:#f1f4f4;color:#242d30;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif;margin:0}header{max-width:1120px;margin:auto;padding:20px 24px;display:flex;justify-content:space-between;align-items:center}main{max-width:1120px;margin:0 auto 20px;background:white;border:1px solid #e3e9e9;border-radius:16px;padding:28px}h1{font-size:26px;margin:0}h2{font-size:18px;margin:0 0 14px}p{color:#56666b}label{display:block;margin-bottom:16px}input,select,textarea,button{font:inherit;border:1px solid #bac7ca;border-radius:8px;padding:10px 12px;color:inherit}input,select,textarea{width:100%;display:block;margin-top:6px;background:white}textarea{font-family:Consolas,monospace}button{cursor:pointer;background:white}button.primary{background:#263c40;color:white}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:24px 0;align-items:start}section{min-width:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.7 Consolas,monospace;background:#f5f8f8;padding:18px;border-radius:10px}#events{max-height:400px;overflow:auto;min-height:100px}.message{color:#255d4b;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#a12b2b}#login{max-width:480px;margin:24px auto}.buttons{display:flex;gap:10px;flex-wrap:wrap}small{color:#54676b}#presets button{margin:4px 8px 4px 0}#board[hidden],#login[hidden],button[hidden]{display:none}:focus-visible{outline:2px solid #28766c;outline-offset:2px}@media(max-width:650px){main{margin:0 8px;padding:20px}.grid{grid-template-columns:1fr}header{padding:16px}h1{font-size:24px}button{min-height:44px}}</style>
<header><strong>↔ Link / 远程串口</strong><button id="logout" hidden>退出登录</button></header><main><h1>通用通信控制台</h1><p>查看网关状态、发送项目命令，执行结果以单片机反馈为准。</p><div id="message" class="message" role="status"></div>
<form id="login"><label>用户名<input name="username" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">登录</button></form>
<div id="board" hidden><div class="grid"><section><h2>网关连接</h2><label>选择设备<select id="device"></select></label><pre id="status">等待状态</pre></section><section><h2>发送命令</h2><form id="command"><label>编码<select id="encoding"><option value="text">文本（自动添加配置的行尾）</option><option value="hex">HEX（无空格，如 010300000001840a）</option></select></label><label>命令内容<textarea id="data" rows="3" required maxlength="1024"></textarea></label><div class="buttons"><button id="send" class="primary" disabled>发送一次</button><button type="button" id="savePreset">保存为常用命令</button></div></form><p><small>命令有效期 5 秒，超时不重发。只读或离线时不能发送。</small></p><div id="presets"></div><button id="clearPresets">清空本机常用命令</button></section></div><h2>收发记录</h2><pre id="events">暂无数据</pre><small>服务器仅保留最近 200 条记录，重启清空；常用命令保存在本浏览器。</small><details style="margin-top:24px"><summary>账号设置</summary><p>修改后所有登录会话失效，设备连接和令牌保持不变。</p><form id="accountForm" style="max-width:480px"><label>用户名<input name="username" maxlength="100" required autocomplete="username"></label><label>当前密码<input name="current_password" type="password" maxlength="256" required autocomplete="current-password"></label><label>新密码（至少8位）<input name="new_password" type="password" minlength="8" maxlength="256" required autocomplete="new-password"></label><label>再次输入新密码<input name="confirm_password" type="password" minlength="8" maxlength="256" required autocomplete="new-password"></label><button>保存账号设置</button></form></details></div></main>
<script>
let csrf='',state={},busy=false;const $=s=>document.querySelector(s);let presets=[];try{presets=JSON.parse(localStorage.getItem('gateway-presets')||'[]');if(!Array.isArray(presets))presets=[]}catch(e){}
function msg(t,err=false){$('#message').textContent=t;$('#message').classList.toggle('error',err)}
async function api(path,data){const r=await fetch(path,{method:data===undefined?'GET':'POST',headers:data===undefined?{}:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:data===undefined?undefined:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||d.result||'请求失败');return d}
function logged(ok){$('#login').hidden=ok;$('#board').hidden=!ok;$('#logout').hidden=!ok}
$('#login').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/login',Object.fromEntries(new FormData(e.target)));csrf=d.csrf;e.target.reset();msg('');await refresh()}catch(e){msg(e.message,true)}};
$('#logout').onclick=async()=>{try{await api('/api/logout',{});logged(false);csrf='';msg('已退出')}catch(e){msg(e.message,true)}};
function selected(){return (state.devices||[]).find(d=>d.id===$('#device').value)}
function render(){const d=selected(),s=d?.status||{};$('#status').textContent=d?`设备：${d.id}\n云端：${d.connected?'在线':'离线 / 状态过期'}\n串口模式：${s.mode||'—'}\n远程写入：${s.remote_write?'开启':'关闭'}\nRX / TX：${s.rx_bytes??'—'} / ${s.tx_bytes??'—'} 字节\n丢弃帧数：${s.dropped_frames??'—'}\n最后串口接收距上报：${s.last_rx_ms>=0?s.last_rx_ms+' ms':'尚无数据'}`:'暂无注册设备';$('#send').disabled=busy||!d?.connected||!s.remote_write;
$('#events').textContent=(state.events||[]).filter(e=>e.device===d?.id).slice(-80).map(e=>`${new Date(e.time*1000).toLocaleTimeString()} ${e.type}  ${e.type==='rx'?e.detail.text+'  [HEX '+e.detail.hex+']':typeof e.detail==='string'?e.detail:JSON.stringify(e.detail)}`).join('\n')||'暂无数据'}
$('#device').onchange=()=>{render();const d=selected();$('#encoding').value=d?.status.mode==='hex'?'hex':'text'};
async function refresh(){try{state=await api('/api/state');csrf=state.csrf;logged(true);if(!$('#accountForm').elements.username.value)$('#accountForm').elements.username.value=state.username||'';const old=$('#device').value;$('#device').replaceChildren(...state.devices.map(d=>new Option(d.id,d.id)));if(state.devices.some(d=>d.id===old))$('#device').value=old;render()}catch(e){if(csrf)msg(e.message,true);logged(false)}}
$('#command').onsubmit=async e=>{e.preventDefault();if(!confirm('发送此命令到所选设备？设备可能立即动作。'))return;busy=true;render();try{const d=await api('/api/devices/'+encodeURIComponent($('#device').value)+'/tx',{encoding:$('#encoding').value,data:$('#data').value});msg(d.ok?'已进入串口发送队列；尚未确认单片机执行，请查看接收记录。':'未确认：'+d.result,!d.ok)}catch(e){msg(e.message,true)}finally{busy=false;await refresh()}};
function showPresets(){const root=$('#presets');root.replaceChildren();for(const p of presets.slice(0,20)){if(!p||typeof p.name!=='string'||typeof p.data!=='string')continue;const b=document.createElement('button');b.textContent=p.name;b.onclick=()=>{$('#data').value=p.data;$('#encoding').value=p.encoding==='hex'?'hex':'text'};root.append(b)}}
$('#savePreset').onclick=()=>{const name=prompt('常用命令名称（只填入输入框，不会自动发送）');if(!name||!$('#data').value)return;presets.push({name:name.slice(0,32),encoding:$('#encoding').value,data:$('#data').value});presets=presets.slice(-20);try{localStorage.setItem('gateway-presets',JSON.stringify(presets));showPresets()}catch(e){msg('浏览器无法保存常用命令',true)}};
$('#clearPresets').onclick=()=>{if(confirm('清空此浏览器的常用命令？')){presets=[];localStorage.removeItem('gateway-presets');showPresets()}};
$('#accountForm').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const d=await api('/api/account',Object.fromEntries(new FormData(e.target)));e.target.reset();csrf='';logged(false);msg(d.message);window.scrollTo(0,0)}catch(e){msg(e.message,true);window.scrollTo(0,0)}finally{button.disabled=false}};
showPresets();(async function tick(){await refresh();setTimeout(tick,2000)})();
</script></html>
